name: Gateway - CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_GATEWAY_REPO }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_GATEWAY_REPO }}:latest \
            .

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_GATEWAY_REPO }}:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_GATEWAY_REPO }}:latest

      - name: Get gateway instance ID
        id: get-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ secrets.GATEWAY_INSTANCE_NAME }}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "❌ Error: Could not find running gateway instance with tag ${{ secrets.GATEWAY_INSTANCE_NAME }}"
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Deploy gateway to EC2 via SSM
        env:
          INSTANCE_ID: ${{ steps.get-instance.outputs.instance_id }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_GATEWAY_REPO }}
          REGION: ${{ secrets.AWS_REGION }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_URL: ${{ secrets.UPSTREAM_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          INTERNAL_KEY: ${{ secrets.INTERNAL_API_KEY }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Gateway to $INSTANCE_ID" \
            --parameters commands="[
              \"APP_DIR=/home/ec2-user/Invento_gateway\",
              \"if [ ! -d \\\"\\\$APP_DIR/.git\\\" ]; then mkdir -p \\\"\\\$APP_DIR\\\" && (git clone https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPO.git \\\"\\\$APP_DIR\\\" || git clone https://github.com/$GITHUB_REPO.git \\\"\\\$APP_DIR\\\"); else cd \\\"\\\$APP_DIR\\\" && git fetch origin && git reset --hard origin/main; fi\",
              \"cd \\\"\\\$APP_DIR\\\"\",
              \"cat << 'EOF' > .env\nNODE_ENV=production\nHOST=0.0.0.0\nPORT=4000\nUPSTREAM_URL=$UPSTREAM_URL\nUPSTREAM_API_PREFIX=/api/v1\nREDIS_URL=$REDIS_URL\nINTERNAL_API_KEY=$INTERNAL_KEY\nGATEWAY_SECRET=$GATEWAY_SECRET\nAPP_URL=$APP_URL\nALLOWED_HOSTS=$ALLOWED_HOSTS\nCOOKIE_SECURE=false\nTRUST_PROXY=true\nSTORAGE_DRIVER=s3\nS3_BUCKET=$S3_BUCKET\nS3_REGION=$REGION\nEOF\",
              \"aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY\",
              \"docker pull $REGISTRY/$REPO:latest\",
              \"docker stop invento-gateway 2>/dev/null || true\",
              \"docker rm invento-gateway 2>/dev/null || true\",
              \"docker run -d --name invento-gateway --restart unless-stopped -p 4000:4000 --env-file .env $REGISTRY/$REPO:latest\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command sent. Command ID: $COMMAND_ID"
          echo "Waiting for deployment to complete..."
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
