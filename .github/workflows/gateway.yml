name: Gateway - CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_GATEWAY_REPO }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_GATEWAY_REPO }}:latest \
            .

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_GATEWAY_REPO }}:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_GATEWAY_REPO }}:latest

      - name: Get gateway instance ID
        id: get-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ secrets.GATEWAY_INSTANCE_NAME }}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "❌ Error: Could not find running gateway instance with tag ${{ secrets.GATEWAY_INSTANCE_NAME }}"
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Deploy gateway to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.get-instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Gateway (Stateless - No .env on disk)" \
            --parameters commands='[
              "APP_DIR=/home/ec2-user/Invento_gateway",
              "if [ ! -d \"$APP_DIR/.git\" ]; then mkdir -p \"$APP_DIR\" && git clone https://github.com/${{ github.repository }}.git \"$APP_DIR\"; else cd \"$APP_DIR\" && git fetch origin && git reset --hard origin/main; fi",
              "cd \"$APP_DIR\"",
              "rm -f .env /home/ec2-user/.env",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
              "docker pull ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_GATEWAY_REPO }}:latest",
              "docker stop invento-gateway 2>/dev/null || true",
              "docker rm invento-gateway 2>/dev/null || true",
              "docker run -d --name invento-gateway --restart unless-stopped -p 4000:4000 -e NODE_ENV=production -e HOST=0.0.0.0 -e PORT=4000 -e UPSTREAM_URL=\"${{ secrets.UPSTREAM_URL }}\" -e UPSTREAM_API_PREFIX=/api/v1 -e REDIS_URL=\"${{ secrets.REDIS_URL }}\" -e INTERNAL_API_KEY=\"${{ secrets.INTERNAL_API_KEY }}\" -e GATEWAY_SECRET=\"${{ secrets.GATEWAY_SECRET }}\" -e APP_URL=\"${{ secrets.APP_URL }}\" -e ALLOWED_HOSTS=\"${{ secrets.ALLOWED_HOSTS }}\" -e COOKIE_SECURE=false -e TRUST_PROXY=true -e STORAGE_DRIVER=s3 -e S3_BUCKET=\"${{ secrets.S3_BUCKET }}\" -e S3_REGION=\"${{ secrets.AWS_REGION }}\" -e SMTP_PROVIDER=\"${{ secrets.SMTP_PROVIDER }}\" -e SMTP_USER=\"${{ secrets.SMTP_USER }}\" -e SMTP_PASS=\"${{ secrets.SMTP_PASS }}\" -e MAIL_FROM=\"${{ secrets.MAIL_FROM }}\" ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_GATEWAY_REPO }}:latest"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command sent. Command ID: $COMMAND_ID"
          echo "Waiting for deployment to complete..."
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ steps.get-instance.outputs.instance_id }}"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ steps.get-instance.outputs.instance_id }}" --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" --output json
